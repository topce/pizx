name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test / Lint / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (offline — fake LLM + mock ACP server)
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (verify published tarball)
        run: npm pack --dry-run
